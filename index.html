<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Myth or Fact?</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #DA2F10;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .app {
    width: 100%;
    max-width: 480px;
    text-align: center;
    color: white;
  }
  h1 {
    font-size: 28px;
    margin: 0 0 4px;
  }
  .office-logo {
    display: block;
    max-width: 140px;
    height: auto;
    margin: 0 auto 12px;
  }
  .start-screen .office-logo {
    max-width: 220px;
    margin: -4px auto 0;
  }
  .game-content .office-logo {
    max-width: 110px;
    margin: 0 auto 14px;
  }
  .sub {
    opacity: 0.85;
    margin-bottom: 20px;
    font-size: 14px;
  }
  .start-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 60vh;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  .start-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .icon-rain {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .icon-rain span {
    position: absolute;
    top: -60px;
    font-size: 26px;
    opacity: 0;
    animation-name: iconFall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  @keyframes iconFall {
    0% { transform: translateY(0); opacity: 0; }
    12% { opacity: 0.35; }
    80% { opacity: 0.35; }
    100% { transform: translateY(420px); opacity: 0; }
  }
  .start-screen > *:not(.icon-rain) {
    position: relative;
    z-index: 1;
  }
  .start-screen .start-title {
    font-size: 60px;
    font-weight: 800;
    margin-bottom: 16px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .start-screen .start-sub {
    font-size: 26px;
    opacity: 0.9;
    margin-bottom: 36px;
    font-weight: 600;
  }
  .start-btn {
    background: white;
    color: #DA2F10;
    font-size: 30px;
    font-weight: 800;
    padding: 26px 60px;
    border-radius: 44px;
    border: none;
    cursor: pointer;
    box-shadow: 0 8px 0 rgba(0,0,0,0.25), 0 12px 20px rgba(0,0,0,0.25);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    animation: startPulse 1.6s ease-in-out infinite;
  }
  .start-btn:active {
    transform: translateY(6px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.25), 0 4px 10px rgba(0,0,0,0.2);
  }
  @keyframes startPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  .game-content {
    display: none;
  }
  .game-content.active {
    display: block;
  }
  .scoreboard { display: none; }
  .stage {
    perspective: 1200px;
    height: 320px;
    margin-bottom: 50px;
    margin-top: 4px;
    position: relative;
  }
  .stack-card {
    position: absolute;
    inset: 0;
    border-radius: 18px;
    background: #4b3f9e;
    box-shadow: 0 10px 24px rgba(0,0,0,0.3);
    border: 2px solid rgba(255,255,255,0.15);
  }
  .stack-card.s1 {
    transform: translate(6px, 10px) rotate(2deg);
    z-index: 1;
  }
  .stack-card.s2 {
    transform: translate(-6px, 18px) rotate(-3deg);
    z-index: 0;
    opacity: 0.85;
  }
  .card {
    position: relative;
    width: 100%;
    height: 100%;
    cursor: pointer;
    z-index: 2;
  }
  .card.flipping .face {
    animation: flipScale 0.5s ease;
  }
  @keyframes flipScale {
    0% { transform: scaleX(1); }
    50% { transform: scaleX(0); }
    100% { transform: scaleX(1); }
  }
  .card.shuffling {
    animation: shuffle 0.6s ease;
  }
  .card.correctPulse {
    animation: correctPulse 0.7s ease;
  }
  .card.wrongShake {
    animation: wrongShake 0.6s ease;
  }
  @keyframes shuffle {
    0% { transform: rotate(0deg) scale(1); }
    25% { transform: rotate(-6deg) scale(1.03); }
    50% { transform: rotate(6deg) scale(1.03); }
    75% { transform: rotate(-3deg) scale(1.01); }
    100% { transform: rotate(0deg) scale(1); }
  }
  @keyframes correctPulse {
    0% { transform: scale(1); }
    30% { transform: scale(1.08); }
    50% { transform: scale(0.98); }
    70% { transform: scale(1.04); }
    100% { transform: scale(1); }
  }
  @keyframes wrongShake {
    0% { transform: translateX(0); }
    20% { transform: translateX(-14px); }
    40% { transform: translateX(12px); }
    60% { transform: translateX(-8px); }
    80% { transform: translateX(6px); }
    100% { transform: translateX(0); }
  }
  .face {
    position: absolute;
    inset: 0;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 26px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    background-size: cover;
    background-position: center;
    overflow: hidden;
  }
  .front {
    color: white;
    z-index: 2;
  }
  .front::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.35), rgba(0,0,0,0.65));
  }
  .back {
    background: #1a1a1a;
    color: #FFFFFF;
    z-index: 1;
    opacity: 0;
    pointer-events: none;
  }
  .card.flipped .front {
    z-index: 1;
    opacity: 0;
    pointer-events: none;
  }
  .card.flipped .back {
    z-index: 2;
    opacity: 1;
    pointer-events: auto;
  }
  .back::before {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.7);
  }
  .front .icon {
    position: absolute;
    top: 14px;
    left: 18px;
    font-size: 12px;
    color: rgba(255,255,255,0.75);
    font-weight: bold;
    letter-spacing: 1px;
    z-index: 2;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
  }
  .statement-text {
    font-weight: 700;
    font-size: 32px;
    line-height: 1.3;
    z-index: 2;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }
  .verdict-word {
    font-size: 38px;
    font-weight: 800;
    z-index: 2;
    color: #FFFFFF;
    text-shadow: 0 1px 3px rgba(0,0,0,0.7);
    -webkit-font-smoothing: antialiased;
  }
  .verdict-word.is-correct {
    color: #2ecc71;
  }
  .verdict-word.is-incorrect {
    color: #ff4d4d;
  }
  .back-inner {
    font-size: 22px;
    font-weight: 600;
    margin-top: 14px;
    line-height: 1.4;
    z-index: 2;
    color: #FFFFFF;
    text-shadow: 0 1px 2px rgba(0,0,0,0.7);
    -webkit-font-smoothing: antialiased;
  }
  .back-inner strong {
    color: #FFFFFF;
  }
  .word-correct {
    color: #2ecc71;
  }
  .word-incorrect {
    color: #ff4d4d;
  }
  .buttons {
    display: flex;
    align-items: center;
    gap: 20px;
    justify-content: center;
    margin-top: 24px;
    margin-bottom: 16px;
  }
  .or-divider {
    font-size: 18px;
    font-weight: 700;
    opacity: 0.8;
    text-transform: uppercase;
  }
  button {
    font-size: 24px;
    font-weight: 800;
    padding: 26px 52px;
    border-radius: 40px;
    border: none;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    box-shadow: 0 8px 0 rgba(0,0,0,0.25), 0 12px 20px rgba(0,0,0,0.25);
  }
  button:active,
  button.pressed {
    transform: translateY(6px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.25), 0 4px 10px rgba(0,0,0,0.2);
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-myth {
    background: #E17055;
    color: white;
  }
  .btn-fact {
    background: #00B894;
    color: white;
  }
  .btn-next {
    background: white;
    color: #6C5CE7;
    margin-top: 8px;
    font-size: 16px;
    padding: 14px 30px;
    box-shadow: 0 6px 0 rgba(0,0,0,0.15), 0 8px 16px rgba(0,0,0,0.2);
  }
  .feedback {
    min-height: 30px;
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .correct { color: #55efc4; }
  .wrong { color: #ff7675; }

  .confetti-piece {
    position: absolute;
    width: 8px;
    height: 14px;
    top: 40%;
    left: 50%;
    opacity: 0;
    z-index: 5;
    pointer-events: none;
  }
  .confetti-piece.go {
    animation: confettiFly 0.9s ease-out forwards;
  }
  @keyframes confettiFly {
    0% { opacity: 1; transform: translate(0,0) rotate(0deg) scale(1); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(0.6); }
  }
  .sad-face {
    position: absolute;
    top: 12px;
    right: 16px;
    font-size: 30px;
    z-index: 6;
    opacity: 0;
    pointer-events: none;
  }
  .sad-face.go {
    animation: sadPop 0.7s ease forwards;
  }
  @keyframes sadPop {
    0% { opacity: 0; transform: translateY(-10px) scale(0.6); }
    30% { opacity: 1; transform: translateY(0) scale(1.15); }
    50% { transform: translateY(3px) scale(0.95) rotate(-4deg); }
    70% { transform: translateY(0) scale(1.05) rotate(4deg); }
    100% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
  }

  .marquee-wrap {
    overflow: hidden;
    white-space: nowrap;
    background: #ffd93d;
    border-radius: 30px;
    padding: 12px 0;
    margin-top: 22px;
    margin-bottom: 16px;
    position: relative;
    z-index: 3;
    display: none;
    box-shadow: 0 6px 0 rgba(0,0,0,0.2), 0 8px 16px rgba(0,0,0,0.25);
  }
  .marquee-wrap.active {
    display: block;
  }
  .marquee-track {
    display: inline-block;
    white-space: nowrap;
    animation: marqueeScroll 7s linear infinite;
    font-size: 18px;
    font-weight: 800;
    color: #8a5c00;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .marquee-track span {
    padding: 0 24px;
  }
  @keyframes marqueeScroll {
    0% { transform: translateX(0%); }
    100% { transform: translateX(-50%); }
  }
</style>
</head>
<body>
<div class="app">
  <div class="start-screen" id="startScreen">
    <img src="logosg.png" alt="Office logo" class="office-logo" />
    <div class="icon-rain" id="iconRain"></div>
    <div class="start-body">
      <div class="start-title">Myth or Fact</div>
      <div class="start-sub">Correct Answers Win A Prize</div>
      <button class="start-btn" id="startBtn">Play</button>
    </div>
  </div>

  <div class="game-content" id="gameContent">
  <img src="logosg.png" alt="Office logo" class="office-logo" />
  <div class="stage" id="stage">
    <div class="stack-card s2"></div>
    <div class="stack-card s1"></div>
    <div class="card" id="card">
      <div class="face front" id="front" style="background-image: url('sa.png');">
        <span class="icon">STATEMENT</span>
        <div class="statement-text" id="frontText">Loading...</div>
      </div>
      <div class="face back" id="back">
        <div id="verdict"></div>
      </div>
    </div>
  </div>

  <div class="feedback" id="feedback" style="display:none;"></div>

  <div class="marquee-wrap" id="marqueeWrap">
    <div class="marquee-track">
      <span>Spin the Wheel for a Prize!</span><span>Spin the Wheel for a Prize!</span><span>Spin the Wheel for a Prize!</span><span>Spin the Wheel for a Prize!</span>
    </div>
  </div>

  <div class="buttons" id="answerButtons" style="display:none;">
    <button class="btn-myth" id="mythBtn">Myth</button>
    <div class="or-divider">or</div>
    <button class="btn-fact" id="factBtn">Fact</button>
  </div>

  <button class="btn-next" id="nextBtn" style="display:none;">Next card →</button>
  </div>
</div>

<script>
const statements = [
  { text: "The Opportunities Fund can support study abroad.", answer: "Fact" },
  { text: "First-year students can immediately apply for the Opportunities Fund.", answer: "Myth",
    correction: "Students become eligible beginning in the spring of sophomore year." },
  { text: "Students may become eligible for the Opportunities Fund beginning in the spring of sophomore year.", answer: "Fact" },
  { text: "The Opportunities Fund can ONLY be used for study abroad.", answer: "Myth",
    correction: "It can also support internships, research, and other approved opportunities." },
  { text: "Internships and research may also qualify for Opportunities Fund support.", answer: "Fact" },
  { text: "The Macaulay Tuition Scholarship covers student fees.", answer: "Myth",
    correction: "It covers tuition, not student fees." },
  { text: "Students should contact their Macaulay Advisor before dropping below full-time enrollment.", answer: "Fact" },
  { text: "Scholarships and grants are automatically guaranteed.", answer: "Myth",
    correction: "Scholarships and grants are not automatically guaranteed — eligibility and renewal depend on meeting requirements." },
  { text: "Students are responsible for monitoring their financial aid records.", answer: "Fact" },

  { text: "The Opportunities Fund may support study abroad, internships, and research.", answer: "Fact" },
  { text: "The Opportunities Fund is only for study abroad.", answer: "Myth",
    correction: "It can also support internships, research, and other approved opportunities." },
  { text: "Students may apply beginning in the spring of sophomore year.", answer: "Fact" },
  { text: "Every eligible student is guaranteed Opportunities Fund support.", answer: "Myth",
    correction: "Eligibility does not guarantee funding — some awards are competitive." },
  { text: "The Opportunities Fund is a one-time grant.", answer: "Fact" },
  { text: "Students should wait until after paying for an opportunity to ask whether it qualifies.", answer: "Myth",
    correction: "Students should check whether an opportunity qualifies before paying for it." },
  { text: "Some Opportunities Fund awards are competitive.", answer: "Fact" },
  { text: "Students should review the requirements before committing to an opportunity.", answer: "Fact" },

  { text: "The tuition scholarship may cover the remaining tuition after other eligible aid is applied.", answer: "Fact" },
  { text: "Students never need to complete FAFSA or TAP if they receive the Macaulay Tuition Scholarship.", answer: "Myth",
    correction: "Students must still complete required financial aid applications like FAFSA and TAP." },
  { text: "Students must complete the required financial aid applications, even if they do not expect to qualify for aid.", answer: "Fact" },
  { text: "The tuition scholarship is usually applied months before the college posts tuition charges.", answer: "Myth",
    correction: "The scholarship is typically applied closer to when the college posts tuition charges, not months ahead." },
  { text: "A bursar notice does not always mean that a student has lost the scholarship.", answer: "Fact" },
  { text: "Students are responsible for reviewing their CUNYfirst financial aid and tuition records.", answer: "Fact" },

  { text: "Part-time enrollment never requires approval.", answer: "Myth",
    correction: "Part-time enrollment requires approval before dropping below full-time status." },
  { text: "Dropping or withdrawing from a class can affect scholarship coverage.", answer: "Fact" },
  { text: "An email reminder is the only way students are expected to know about a requirement.", answer: "Myth",
    correction: "Students are expected to proactively check their Macaulay email and CUNYfirst account, not just wait for reminders." },
  { text: "Students should regularly check their Macaulay email and CUNYfirst account.", answer: "Fact" },
  { text: "Scholarship requirements only matter during a student's first year.", answer: "Myth",
    correction: "Scholarship requirements apply throughout a student's time in the program, not just the first year." },
  { text: "Students should keep copies of financial aid documents and important emails.", answer: "Fact" },

  { text: "Scholarships and grants are the same as student loans.", answer: "Myth",
    correction: "Unlike loans, scholarships and grants generally do not have to be repaid when program conditions are met." },
  { text: "A grant generally does not have to be repaid when all program conditions are met.", answer: "Fact" },
  { text: "Research opportunities are only available to science majors.", answer: "Myth",
    correction: "Research opportunities are open to students across majors, not just science majors." },
  { text: "Study abroad can include programs lasting less than a full semester.", answer: "Fact" },
  { text: "Ignoring a request for missing information will make it disappear.", answer: "Myth",
    correction: "Ignoring a request for missing information can delay or jeopardize aid — students should respond promptly." }
];

const cardImages = ["sa.png", "ir.png", "sg.png"];

let deck = [];
let current = null;
let answered = false;

const card = document.getElementById('card');
const front = document.getElementById('front');
const back = document.getElementById('back');
const verdict = document.getElementById('verdict');
const feedback = document.getElementById('feedback');
const answerButtons = document.getElementById('answerButtons');
const nextBtn = document.getElementById('nextBtn');
const stage = document.getElementById('stage');
const marqueeWrap = document.getElementById('marqueeWrap');
const mythBtn = document.getElementById('mythBtn');
const factBtn = document.getElementById('factBtn');

function shuffleDeck() {
  deck = [...statements];
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
}

function randomImage() {
  return cardImages[Math.floor(Math.random() * cardImages.length)];
}

function drawCard() {
  if (deck.length === 0) shuffleDeck();
  current = deck.pop();
  card.classList.remove('flipped', 'correctPulse', 'wrongShake');
  card.classList.add('shuffling');
  setTimeout(function () { card.classList.remove('shuffling'); }, 600);

  front.style.backgroundImage = "url('" + randomImage() + "')";
  front.innerHTML = '<span class="icon">STATEMENT</span><div class="statement-text">' + current.text + '</div>';
  answered = false;
  answerButtons.style.display = 'flex';
  nextBtn.style.display = 'none';
  marqueeWrap.classList.remove('active');
  mythBtn.disabled = false;
  factBtn.disabled = false;
}

function spawnConfetti() {
  const colors = ['#55efc4', '#00B894', '#fdcb6e', '#74b9ff', '#ffffff'];
  for (let i = 0; i < 18; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    const angle = Math.random() * Math.PI * 2;
    const dist = 80 + Math.random() * 100;
    piece.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
    piece.style.setProperty('--dy', Math.sin(angle) * dist - 40 + 'px');
    piece.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
    stage.appendChild(piece);
    requestAnimationFrame(() => piece.classList.add('go'));
    setTimeout(() => piece.remove(), 950);
  }
}

function spawnSadFace() {
  const face = document.createElement('div');
  face.className = 'sad-face';
  face.textContent = String.fromCodePoint(0x1F61E);
  stage.appendChild(face);
  requestAnimationFrame(() => face.classList.add('go'));
  setTimeout(() => face.remove(), 1400);
}

function handleAnswer(choice, btn) {
  if (answered || !current) return;
  answered = true;

  btn.classList.add('pressed');
  setTimeout(() => btn.classList.remove('pressed'), 150);
  mythBtn.disabled = true;
  factBtn.disabled = true;

  const isCorrect = choice === current.answer;

  var correctionHtml;
  if (isCorrect) {
    correctionHtml = current.answer === 'Myth' && current.correction
      ? '<div class="back-inner"><strong><span class="word-correct">Correct!</span> ' + current.correction + '</strong></div>'
      : '<div class="back-inner"><strong><span class="word-correct">Correct!</span> ' + current.text + '</strong></div>';
  } else {
    correctionHtml = current.answer === 'Myth' && current.correction
      ? '<div class="back-inner"><span class="word-incorrect">Incorrect</span> — it\u2019s actually a Myth. ' + current.correction + '</div>'
      : '<div class="back-inner"><span class="word-incorrect">Incorrect</span> — it\u2019s actually a Fact. ' + current.text + '</div>';
  }

  verdict.innerHTML = '<div class="verdict-word ' + (isCorrect ? 'is-correct' : 'is-incorrect') + '">' + current.answer.toUpperCase() + '</div>' + correctionHtml;
  card.classList.add('flipping');
  setTimeout(function () {
    card.classList.add('flipped');
  }, 250);
  setTimeout(function () {
    card.classList.remove('flipping');
  }, 500);

  if (isCorrect) {
    setTimeout(function () {
      card.classList.add('correctPulse');
      spawnConfetti();
    }, 620);
    marqueeWrap.classList.add('active');
  } else {
    setTimeout(function () {
      card.classList.add('wrongShake');
      spawnSadFace();
    }, 620);
    marqueeWrap.classList.remove('active');
  }

  answerButtons.style.display = 'none';
  nextBtn.style.display = 'inline-block';
}

card.addEventListener('click', function () {
  if (!answered && current) return;
  drawCard();
});

mythBtn.addEventListener('click', function () { handleAnswer('Myth', mythBtn); });
factBtn.addEventListener('click', function () { handleAnswer('Fact', factBtn); });
nextBtn.addEventListener('click', drawCard);

const startScreen = document.getElementById('startScreen');
const gameContent = document.getElementById('gameContent');
const startBtn = document.getElementById('startBtn');
const iconRain = document.getElementById('iconRain');

const rainIcons = ['\u{1F3AE}', '\u{1F579}\u{FE0F}', '\u{1F3AE}', '\u{1F3B2}', '\u{1F579}\u{FE0F}'];
const rainCount = 14;
for (let i = 0; i < rainCount; i++) {
  const el = document.createElement('span');
  el.textContent = rainIcons[Math.floor(Math.random() * rainIcons.length)];
  el.style.left = (Math.random() * 92) + '%';
  const duration = 5 + Math.random() * 4;
  const delay = Math.random() * 8;
  el.style.animationDuration = duration + 's';
  el.style.animationDelay = '-' + delay + 's';
  el.style.fontSize = (20 + Math.random() * 14) + 'px';
  iconRain.appendChild(el);
}

startBtn.addEventListener('click', function () {
  startScreen.style.display = 'none';
  gameContent.classList.add('active');
  drawCard();
});
</script>
</body>
</html>
