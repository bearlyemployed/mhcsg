<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Mack Town: a walkable Macaulay Honors College</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#C4122F; --red-deep:#8e0f24; --ink:#191b22; --slate:#262b37; --slate-2:#343a49;
  --stone:#ddd8cc; --stone-dim:#a9a596; --gold:#e3b04b; --glass:#9fc4dc;
  --display:"Pixelify Sans","Trebuchet MS",Verdana,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ink);color:var(--stone);font-family:var(--body);overflow:hidden;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:var(--ink)}

/* ---------- HUD */
#hud{position:fixed;inset:0;pointer-events:none;display:none}
#hud.on{display:block}
#hud > *{pointer-events:auto}
.panel{background:rgba(38,43,55,.92);border:2px solid #0e1016;box-shadow:0 0 0 2px var(--slate-2) inset;border-radius:4px}

#where{position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px}
#floorGlyph{font-family:var(--display);font-weight:700;font-size:22px;line-height:1;width:38px;height:38px;display:grid;place-items:center;
  background:var(--red);color:#fff;border-radius:3px}
#floorName{font-size:12px;color:var(--stone-dim)}
#roomName{font-family:var(--display);font-size:17px;line-height:1.15}
#roomNote{font-size:11px;color:var(--gold);display:none}
#roomNote.on{display:block}

#near{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;max-width:46vw;flex-wrap:wrap;justify-content:center;pointer-events:none}
.chip{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;font-size:12px;background:rgba(38,43,55,.92);border:2px solid #0e1016;border-radius:20px}
.chip i{width:18px;height:18px;border-radius:50%;display:block;border:2px solid rgba(255,255,255,.35)}

#side{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#mini{padding:6px;line-height:0}
#mini canvas{width:112px;height:128px;image-rendering:pixelated;display:block}
#count{font-size:12px;padding:5px 10px}

#chat{position:absolute;left:12px;bottom:12px;width:min(360px,calc(100vw - 24px));display:flex;flex-direction:column;gap:6px}
#log{max-height:150px;overflow-y:auto;padding:8px 10px;font-size:13px;line-height:1.4;scrollbar-width:thin}
#log:empty{display:none}
#log p{margin:0 0 3px}
#log b{font-weight:600}
#log .sys{color:var(--stone-dim);font-style:italic}
#log .all b::after{content:" to everyone";font-weight:400;color:var(--stone-dim)}
#sayRow{display:flex;gap:6px;padding:6px}
#scope{background:var(--slate-2);border:0;border-radius:3px;padding:0 10px;font-size:12px;white-space:nowrap}
#say{flex:1;min-width:0;background:#12141a;border:2px solid #0e1016;border-radius:3px;padding:8px 10px;font-size:14px}
#say::placeholder{color:#777c8a}

#actions{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#act{display:none;padding:10px 14px;font-family:var(--display);font-size:15px;background:var(--red);border-color:#4d0713;box-shadow:none;color:#fff}
#act.on{display:block}
#act kbd{font:inherit;background:rgba(0,0,0,.3);padding:0 6px;border-radius:3px;margin-right:6px}
#emotes{display:flex;gap:4px;padding:4px}
#emotes button{background:none;border:0;font-size:20px;width:36px;height:36px;border-radius:3px}
#emotes button:hover{background:var(--slate-2)}

#card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(380px,calc(100vw - 32px));padding:18px 18px 16px;display:none}
#card.on{display:block}
#card h2{margin:0 0 8px;font-family:var(--display);font-size:22px;font-weight:700;line-height:1.1}
#card p{margin:0 0 14px;font-size:15px;line-height:1.5}
#card .floors{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
#card .floors button{display:flex;gap:12px;align-items:center;text-align:left;background:var(--slate-2);border:2px solid #0e1016;border-radius:3px;padding:8px 10px}
#card .floors button[disabled]{opacity:.45;cursor:default}
#card .floors button b{font-family:var(--display);font-size:18px;width:26px;text-align:center;color:var(--gold)}
#card .floors button span{font-size:13px;line-height:1.3}
#card .floors button small{display:block;color:var(--stone-dim)}
.btn{background:var(--slate-2);border:2px solid #0e1016;border-radius:3px;padding:8px 14px;font-size:14px}
.btn.go{background:var(--red);color:#fff;font-family:var(--display);font-size:18px;padding:12px 18px;width:100%}
.btn.go:hover{background:#d8183a}

@media (max-width:820px){#near{top:66px;left:12px;transform:none;justify-content:flex-start;max-width:60vw} #mini{display:none} #log{max-height:96px}
  #actions{bottom:auto;top:12px} #side{top:auto;bottom:calc(12px + 58px)} #emotes{flex-direction:column}}

/* ---------- Join screen */
#join{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(320px,.9fr);background:var(--slate);overflow:auto}
#join.off{display:none}
#facadeWrap{position:relative;min-height:100%;overflow:hidden;background:#1b2440}
#facade{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;object-fit:cover}
#joinForm{padding:clamp(24px,5vw,64px);display:flex;flex-direction:column;justify-content:center;gap:18px;background:var(--slate);border-left:4px solid #0e1016;max-width:560px}
#joinForm h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,5vw,56px);line-height:.95;margin:0;color:#fff;letter-spacing:-.01em}
#joinForm h1 span{display:block;font-size:.42em;font-weight:500;color:var(--gold);margin-top:10px;letter-spacing:0}
#joinForm p{margin:0;font-size:15px;line-height:1.55;max-width:42ch}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--stone-dim)}
label.f input{background:#12141a;border:2px solid #0e1016;border-radius:3px;padding:10px 12px;font-size:16px;color:var(--stone)}
#lookRow{display:flex;gap:16px;align-items:center}
#preview{width:96px;height:120px;image-rendering:pixelated;background:#12141a;border:2px solid #0e1016;border-radius:3px;flex:none}
#pickers{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.pick{display:flex;align-items:center;gap:8px;font-size:13px}
.pick span{width:44px;color:var(--stone-dim)}
.sw{display:flex;gap:4px;flex-wrap:wrap}
.sw button{width:22px;height:22px;border-radius:3px;border:2px solid #0e1016;padding:0}
.sw button[aria-pressed=true]{outline:2px solid #fff;outline-offset:1px}
.sw.txt button{width:auto;height:auto;padding:3px 8px;background:var(--slate-2);font-size:12px}
#mode{font-size:12.5px;color:var(--stone-dim);line-height:1.5}
@media (max-width:820px){
  #join{grid-template-columns:1fr;grid-template-rows:34vh auto}
  #facadeWrap{min-height:0}
  #joinForm{border-left:0;border-top:4px solid #0e1016;max-width:none;justify-content:flex-start}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="game" aria-label="Macaulay building map"></canvas>

<div id="hud">
  <div id="where" class="panel">
    <div id="floorGlyph">1</div>
    <div><div id="floorName">Main floor</div><div id="roomName">West 67th Street</div><div id="roomNote">Private room. Chat stays inside.</div></div>
  </div>
  <div id="near" aria-live="polite"></div>
  <div id="side">
    <div id="mini" class="panel"><canvas width="112" height="128"></canvas></div>
    <div id="count" class="panel" hidden>Just you here</div>
  </div>
  <div id="chat">
    <div id="log" class="panel" aria-live="polite"></div>
    <div id="sayRow" class="panel">
      <button id="scope" title="Who hears you">Nearby</button>
      <input id="say" maxlength="200" placeholder="Say something to people near you" autocomplete="off">
    </div>
  </div>
  <div id="actions">
    <button id="act" class="panel"></button>
    <div id="emotes" class="panel"></div>
  </div>
  <div id="card" class="panel" role="dialog" aria-modal="true"><h2></h2><p></p><div class="floors"></div><button class="btn" id="cardClose">Close</button></div>
</div>

<div id="join">
  <div id="facadeWrap"><canvas id="facade" width="200" height="230"></canvas></div>
  <div id="joinForm">
    <h1>Mack Town<span>A walkable Macaulay Honors College</span></h1>
    <p>Six floors, from the Cabaret up to the admin offices, named for Macaulay's mountain lion mascot. Walk up to someone to talk to them. Walk away to leave the conversation.</p>
    <label class="f">Your name<input id="nameIn" maxlength="16" placeholder="Name" autocomplete="nickname"></label>
    <div id="lookRow">
      <canvas id="preview" width="48" height="60"></canvas>
      <div id="pickers"></div>
    </div>
    <label class="f" id="spaceField" hidden>Space code (people with the same code see each other)<input id="spaceIn" maxlength="24" value="macaulay"></label>
    <button class="btn go" id="enter">Walk in</button>
    <div id="mode"></div>
  </div>
</div>

/* ---------- pathfinding */
function bfs(f,sx,sy,allowPortals=true){
  const dist=new Int16Array(W*H).fill(-1), prev=new Int32Array(W*H).fill(-1), q=[sy*W+sx]; dist[sy*W+sx]=0;
  for(let qi=0;qi<q.length;qi++){const cur=q[qi],cx=cur%W,cy=(cur-cx)/W;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dx,ny=cy+dy,k=ny*W+nx;
      if(nx<0||ny<0||nx>=W||ny>=H||dist[k]>=0||solidAt(f,nx,ny))continue;
      if(!allowPortals&&PORTAL.includes(tileAt(f,nx,ny)))continue;
      dist[k]=dist[cur]+1;prev[k]=cur;q.push(k)}}
  return {dist,prev};
}
function pathTo(f,sx,sy,tx,ty,allowPortals=true){
  const {dist,prev}=bfs(f,sx,sy,allowPortals); let best=-1,bs=1e9;
  for(let k=0;k<W*H;k++){if(dist[k]<0)continue;const x=k%W,y=(k-x)/W,d=Math.hypot(x-tx,y-ty)*10+dist[k]*.01;if(d<bs){bs=d;best=k}}
  const out=[];for(let k=best;k>=0&&k!==sy*W+sx;k=prev[k]){const x=k%W;out.unshift({x:x+.5,y:(k-x)/W+.5})}
  return out;
}

/* ---------- movement */
function blocked(f,x,y){const hx=.27,hy=.17;
  return solidAt(f,Math.floor(x-hx),Math.floor(y-hy))||solidAt(f,Math.floor(x+hx),Math.floor(y-hy))||solidAt(f,Math.floor(x-hx),Math.floor(y+hy))||solidAt(f,Math.floor(x+hx),Math.floor(y+hy))}
function moveEntity(e,dx,dy,dt,speed){
  const len=Math.hypot(dx,dy); if(!len){e.moving=false;return 0}
  dx=dx/len*speed*dt; dy=dy/len*speed*dt; let moved=0;
  if(!blocked(e.floor,e.x+dx,e.y)){e.x+=dx;moved+=Math.abs(dx)}
  if(!blocked(e.floor,e.x,e.y+dy)){e.y+=dy;moved+=Math.abs(dy)}
  e.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down');
  e.moving=moved>1e-4; if(e.moving)e.animT+=dt; return moved;
}
function followPath(e,p,dt,speed){
  if(!p.length){e.moving=false;return}
  const wp=p[0],dx=wp.x-e.x,dy=wp.y-e.y,d=Math.hypot(dx,dy);
  if(d<speed*dt+.02){e.x=wp.x;e.y=wp.y;p.shift();e.moving=p.length>0;e.animT+=dt;return}
  e.x+=dx/d*speed*dt;e.y+=dy/d*speed*dt;e.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down');e.moving=true;e.animT+=dt;
}

    else{ w.moving=false; w.wait-=dt; if(w.wait<=0){ w.wait=2+Math.random()*5;
        for(let tries=0;tries<12;tries++){const tx=1+Math.floor(Math.random()*26),ty=Math.floor(Math.random()*H);
          if(!solidAt(w.floor,tx,ty)&&!PORTAL.includes(tileAt(w.floor,tx,ty))){const p=pathTo(w.floor,Math.floor(w.x),Math.floor(w.y),tx,ty,false);if(p.length&&p.length<40){w.path=p;break}}} } }
    w.nextLine-=dt; if(w.nextLine<=0){w.nextLine=14+Math.random()*16; if(w.floor===me.floor&&Math.hypot(w.x-me.x,w.y-me.y)<RANGE&&!myArea()){const l=WANDERER_LINES[Math.floor(Math.random()*WANDERER_LINES.length)];say(w,l);logLine(w.name,l)}}
  }
}

/* =====================================================================
   Loop
   ===================================================================== */
const cv=$('#game'), ctx=cv.getContext('2d'); let dpr=1, zoom=2, vw=0, vh=0, camX=0, camY=0;
function resize(){dpr=Math.min(window.devicePixelRatio||1,3);vw=innerWidth;vh=innerHeight;cv.width=Math.round(vw*dpr);cv.height=Math.round(vh*dpr);
  zoom=vw<700?1.25:(vw>1900?2.5:2)}
addEventListener('resize',resize);

function others(){const list=[...npcs,...wanderers,...Net.peers.values()];return list.filter(e=>e.floor===me.floor)}
function update(dt){
  if(!cardOpen){
    let dx=0,dy=0; if(keys.has('left'))dx--; if(keys.has('right'))dx++; if(keys.has('up'))dy--; if(keys.has('down'))dy++;
    if(dx||dy){path=[];pendingLook=null;moveEntity(me,dx,dy,dt,SPEED)}
    else if(path.length){const bx=me.x,by=me.y;followPath(me,path,dt,SPEED); if(blocked(me.floor,me.x,me.y)){me.x=bx;me.y=by;path=[];me.moving=false}
      if(Math.hypot(me.x-bx,me.y-by)<1e-4){stall+=dt;if(stall>.5){path=[];stall=0}}else stall=0;
      if(!path.length&&pendingLook){const tg=nearestTarget();if(tg&&tg.t===pendingLook)look(tg);pendingLook=null} }
    else me.moving=false;
    checkPortal();
  }
  Net.tick(dt); if(!Net.on)tickWanderers(dt); Net.push(false);
  target=cardOpen?null:nearestTarget();
  const viewW=vw/zoom,viewH=vh/zoom,mapW=W*T,mapH=H*T;
  const tx=mapW<=viewW?(mapW-viewW)/2:clamp(me.x*T-viewW/2,-40,mapW-viewW+40), ty=clamp(me.y*T-16-viewH/2,-viewH*.35,mapH-viewH*.65);
  camX+=(tx-camX)*Math.min(1,dt*10);camY+=(ty-camY)*Math.min(1,dt*10);
}
function inEarshot(e){const mine=myArea(),r=roomAt(e.floor,Math.floor(e.x),Math.floor(e.y)),theirs=r&&r.private?e.floor+':'+r.name:'';
  if(mine||theirs)return mine===theirs; return Math.hypot(e.x-me.x,e.y-me.y)<=RANGE}
function wrap(c,text,maxW){const words=text.split(/\s+/),lines=[];let cur='';
  for(const w of words){const t=cur?cur+' '+w:w;if(c.measureText(t).width>maxW&&cur){lines.push(cur);cur=w}else cur=t} if(cur)lines.push(cur);
  if(lines.length>4){lines.length=4;lines[3]=lines[3].replace(/.{0,3}$/,'…')} return lines}
function render(now){
  const s=zoom*dpr; ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#12141a';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(s,0,0,s,Math.round(-camX*s),Math.round(-camY*s));
  ctx.imageSmoothingEnabled=(s/PR)%1!==0; if(floorCv)ctx.drawImage(floorCv,0,0,W*T,H*T);
  // hearing range
  if(!myArea()){ctx.strokeStyle='rgba(255,255,255,.16)';ctx.lineWidth=1.5;ctx.setLineDash([4,5]);ctx.beginPath();ctx.ellipse(me.x*T,me.y*T,RANGE*T,RANGE*T,0,0,7);ctx.stroke();ctx.setLineDash([])}
  const ents=[me,...others()].sort((a,b)=>a.y-b.y);
  for(const e of ents){ if(e!==me&&inEarshot(e)){ctx.strokeStyle='rgba(227,176,75,.9)';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(e.x*T,e.y*T,13,6,0,0,7);ctx.stroke()}
    drawAvatar(ctx,Math.round(e.x*T),Math.round(e.y*T),e) }
  if(target){const bob=CALM?0:Math.sin(now/220)*2, px=target.x*T, py=target.y*T-(target.kind==='npc'?52:30)+bob;
    ctx.fillStyle='#0e1016';ctx.fillRect(px-8,py-8,16,16);ctx.fillStyle='#e3b04b';ctx.fillRect(px-7,py-7,14,14);ctx.fillStyle='#0e1016';ctx.font='700 11px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('X',px,py+.5)}
  // labels in screen space
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.textAlign='center';ctx.textBaseline='middle';
  for(const e of ents){ const sx=(e.x*T-camX)*zoom, sy=(e.y*T-camY)*zoom, top=sy-47*zoom; let y=top;
    ctx.font='600 12px system-ui,sans-serif'; const nm=e===me?e.name+' (you)':e.name, w=ctx.measureText(nm).width+12;
    ctx.globalAlpha=(e===me||inEarshot(e))?1:.55; ctx.fillStyle='rgba(14,16,22,.78)';ctx.fillRect(sx-w/2,y-9,w,18);ctx.fillStyle=e.npc?'#e3b04b':'#fff';ctx.fillText(nm,sx,y+.5);ctx.globalAlpha=1; y-=14;
    if(e.bubble&&now<e.bubbleUntil){ ctx.font='13px system-ui,sans-serif';const lines=wrap(ctx,e.bubble,190),bw=Math.max(...lines.map(l=>ctx.measureText(l).width))+18,bh=lines.length*17+12;
      y-=bh/2;ctx.fillStyle='#0e1016';ctx.fillRect(sx-bw/2-2,y-bh/2-2,bw+4,bh+4);ctx.fillStyle='#fbfaf6';ctx.fillRect(sx-bw/2,y-bh/2,bw,bh);
      ctx.fillStyle='#0e1016';ctx.fillRect(sx-4,y+bh/2+2,8,4);ctx.fillStyle='#fbfaf6';ctx.fillRect(sx-3,y+bh/2,6,4);
      ctx.fillStyle='#191b22';lines.forEach((l,i)=>ctx.fillText(l,sx,y-bh/2+6+8.5+i*17)); y-=bh/2+6 }
    if(e.emote&&now<e.emoteUntil){const k=1-(e.emoteUntil-now)/2800;ctx.font='26px system-ui,sans-serif';ctx.globalAlpha=k>.8?(1-k)*5:1;ctx.fillText(e.emote,sx,y-16-k*14);ctx.globalAlpha=1} }
}
let hudT=0,lastRoom='';
function hud(dt){
  hudT-=dt;if(hudT>0)return;hudT=.2;
  const r=roomAt(me.floor,Math.floor(me.x),Math.floor(me.y)),fl=floorInfo(me.floor),rn=(r?r.name:fl.label);
  if(rn+me.floor!==lastRoom){lastRoom=rn+me.floor;$('#floorGlyph').textContent=me.floor;$('#floorName').textContent=fl.label;$('#roomName').textContent=rn;$('#roomNote').classList.toggle('on',!!(r&&r.private))}
  const near=others().filter(e=>inEarshot(e)), box=$('#near'), sig=near.map(e=>e.id).join(',');
  if(box.dataset.sig!==sig){box.dataset.sig=sig;box.textContent='';near.slice(0,8).forEach(e=>{const c=document.createElement('div');c.className='chip';const i=document.createElement('i');i.style.background=e.species==='lion'?'#d9a05b':SHIRTS[e.look.s];c.append(i,e.name);box.appendChild(c)})}
  $('#say').placeholder=scopeAll?'Say something to the whole building':(myArea()?'Say something to this room':(near.length?'Say something to '+(near.length===1?near[0].name:near.length+' people nearby'):'Nobody is close enough to hear you'));
  const act=$('#act'); if(target){act.classList.add('on');act.textContent='';const k=document.createElement('kbd');k.textContent='X';act.append(k,target.kind==='npc'?'Talk to '+target.title:'Look at '+target.title.toLowerCase())}else act.classList.remove('on');
  if(Net.on){$('#count').hidden=false;const n=Net.peers.size+1,here=[...Net.peers.values()].filter(p=>p.floor===me.floor).length+1;$('#count').textContent=n===1?'Just you here':n+' in the building, '+here+' on this floor'}
  const mc=$('#mini canvas').getContext('2d');if(miniCv){mc.drawImage(miniCv,0,0);for(const e of others()){mc.fillStyle=e.npc?'#e3b04b':'#3b6fd1';mc.fillRect(Math.floor(e.x*4)-1,Math.floor(e.y*4)-1,3,3)}mc.fillStyle='#fff';mc.fillRect(Math.floor(me.x*4)-2,Math.floor(me.y*4)-2,5,5);mc.fillStyle='#C4122F';mc.fillRect(Math.floor(me.x*4)-1,Math.floor(me.y*4)-1,3,3)}
}
let last=0;
function frame(now){const dt=Math.min(.05,(now-last)/1000||0);last=now;if(started){update(dt);render(now);hud(dt)}requestAnimationFrame(frame)}

/* =====================================================================
   Input
   ===================================================================== */
const KEYMAP={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down'};
addEventListener('keydown',e=>{
  if(!started)return; const typing=document.activeElement===$('#say');
  if(e.key==='Escape'){if(cardOpen)closeCard();else if(typing){$('#say').blur();cv.focus()}return}
  if(typing){if(e.key==='Enter'){sendChat($('#say').value);$('#say').value='';$('#say').blur();cv.focus()}return}
  if(cardOpen){if(e.key==='x'||e.key==='X'){e.preventDefault();closeCard()}return}
  if(KEYMAP[e.key]){keys.add(KEYMAP[e.key]);e.preventDefault();return}
  if(e.key==='Enter'){e.preventDefault();$('#say').focus();return}
  if(e.key==='x'||e.key==='X'||e.key==='e'||e.key==='E'){look(target);return}
  if(e.key>='1'&&e.key<='5')emote(+e.key-1);
  if(e.key==='m'||e.key==='M')$('#mini').hidden=!$('#mini').hidden;
});
addEventListener('keyup',e=>{if(KEYMAP[e.key])keys.delete(KEYMAP[e.key])});
addEventListener('blur',()=>keys.clear());
cv.tabIndex=0;
cv.addEventListener('pointerdown',e=>{
  if(!started||cardOpen)return; cv.focus();
  const wx=(e.clientX/zoom+camX)/T, wy=(e.clientY/zoom+camY)/T;
  let hit=null; for(const t of THINGS[me.floor])if(Math.abs(t.x+.5-wx)<.6&&Math.abs(t.y+.5-wy)<.7)hit={t,x:t.x,y:t.y};
  for(const n of npcs)if(n.floor===me.floor&&Math.abs(n.x-wx)<.5&&wy>n.y-1.3&&wy<n.y+.3)hit={t:n,x:Math.floor(n.x),y:Math.floor(n.y)};
  if(hit){const tg=nearestTarget();if(tg&&tg.t===hit.t){look(tg);return}pendingLook=hit.t;path=pathTo(me.floor,Math.floor(me.x),Math.floor(me.y),hit.x,hit.y);
    if(path.length&&!solidAt(me.floor,hit.x,hit.y)&&hit.t.npc)path.pop();return}
  pendingLook=null;path=pathTo(me.floor,Math.floor(me.x),Math.floor(me.y),Math.floor(wx),Math.floor(wy));
});
$('#act').onclick=()=>look(target);
$('#cardClose').onclick=closeCard;
$('#scope').onclick=()=>{scopeAll=!scopeAll;$('#scope').textContent=scopeAll?'Everyone':'Nearby';hudT=0};
EMOTES.forEach((em,i)=>{const b=document.createElement('button');b.textContent=em;b.title='Emote '+(i+1);b.onclick=()=>{emote(i);cv.focus()};$('#emotes').appendChild(b)});

/* =====================================================================
   Join screen
   ===================================================================== */
function drawFacade(){
  const c=$('#facade').getContext('2d'),Wd=200,Hd=230;
  const g=c.createLinearGradient(0,0,0,Hd);g.addColorStop(0,'#141a33');g.addColorStop(.6,'#3a3f66');g.addColorStop(1,'#c9775a');c.fillStyle=g;c.fillRect(0,0,Wd,Hd);
  for(let i=0;i<26;i++)R(c,Math.floor(rnd(i,3)*Wd),Math.floor(rnd(i,7)*90),1,1,'rgba(255,255,255,.7)');
  // neighbours
  R(c,0,40,52,160,'#2a2438');R(c,148,22,52,178,'#241f33');
  for(let y=0;y<9;y++)for(let x=0;x<3;x++){if(rnd(x,y,1)>.45)R(c,8+x*14,50+y*16,7,9,'#e9c46a');if(rnd(x,y,2)>.5)R(c,156+x*14,32+y*17,7,10,'#e9c46a')}
  // Macaulay: limestone Gothic Revival
  const bx=52,bw=96,by=44,stone='#d6cfbb',dark='#b4ac95';
  R(c,bx,by,bw,156,stone);
  for(let i=0;i<8;i++)R(c,bx+Math.round(i*12.57),by-8,8,8,stone);          // crenellated parapet
  R(c,bx,by,bw,3,dark);R(c,bx-2,by+2,bw+4,2,'#ece6d6');
  for(let y=0;y<156;y+=8)R(c,bx,by+y,bw,1,'rgba(0,0,0,.06)');
  R(c,bx,by,5,156,dark);R(c,bx+bw-5,by,5,156,dark);                              // corner piers
  const arch=(x,y,w,h,lit)=>{R(c,x-1,y+3,w+2,h-2,dark);R(c,x,y+4,w,h-4,lit);R(c,x+1,y+2,w-2,2,lit);R(c,x+2,y+1,w-4,1,lit);R(c,x+w/2-1,y,2,1,lit);
    R(c,x+w/2-.5,y+1,1,h-1,dark);R(c,x,y+Math.floor(h*.45),w,1,dark)};
  for(let s=0;s<4;s++)for(let i=0;i<4;i++){const lit=rnd(s,i,5)>.3?'#f2cf7a':'#38405c';arch(bx+11+i*21,by+12+s*27,12,18,lit)}
  for(let s=1;s<4;s++)R(c,bx,by+8+s*27-3,bw,2,'#ece6d6');
  // ground floor: entrance arch, red doors, banners
  R(c,bx+bw/2-15,by+116,30,40,dark);R(c,bx+bw/2-12,by+121,24,35,'#2a1a1d');R(c,bx+bw/2-10,by+118,20,4,'#2a1a1d');R(c,bx+bw/2-6,by+116,12,3,'#2a1a1d');
  R(c,bx+bw/2-10,by+128,9,28,'#C4122F');R(c,bx+bw/2+1,by+128,9,28,'#C4122F');R(c,bx+bw/2-3,by+142,2,2,'#e3b04b');R(c,bx+bw/2+1,by+142,2,2,'#e3b04b');
  R(c,bx+bw/2-10,by+122,20,5,'#f2cf7a');
  arch(bx+10,by+124,14,22,'#f2cf7a');arch(bx+bw-24,by+124,14,22,'#f2cf7a');
  for(const x of [bx+30,bx+bw-36]){R(c,x,by+112,6,26,'#C4122F');R(c,x,by+136,3,3,'#C4122F');R(c,x+1,by+118,1,6,'#fff');R(c,x+4,by+118,1,6,'#fff');R(c,x+2,by+119,1,2,'#fff');R(c,x+3,by+119,1,2,'#fff')}
  // stoop, sidewalk, street
  R(c,bx+bw/2-16,200,32,2,'#ece6d6');R(c,bx+bw/2-19,202,38,2,'#c9c2ae');
  R(c,0,204,Wd,10,'#8f8c84');R(c,0,204,Wd,1,'#b9b6ae');R(c,0,214,Wd,16,'#2c2e35');for(let i=0;i<10;i++)R(c,i*22+4,221,10,1,'#e0a526');
  // tree + cab
  R(c,27,176,3,28,'#3a2a1c');c.fillStyle='#24543a';c.beginPath();c.arc(28,170,14,0,7);c.fill();c.fillStyle='#2f7d4a';c.beginPath();c.arc(24,166,8,0,7);c.fill();
  R(c,122,210,40,9,'#f2c230');R(c,130,205,22,6,'#f2c230');R(c,132,206,8,4,'#22303f');R(c,142,206,8,4,'#22303f');R(c,127,218,6,4,'#111');R(c,151,218,6,4,'#111');R(c,160,212,2,3,'#fff6c4');
  // lamp glow
  R(c,172,178,2,26,'#1a1c24');R(c,169,175,8,4,'#f2cf7a');c.fillStyle='rgba(242,207,122,.18)';c.beginPath();c.arc(173,180,16,0,7);c.fill();
}
function drawPreview(){const c=$('#preview').getContext('2d');c.clearRect(0,0,48,60);c.fillStyle='#12141a';c.fillRect(0,0,48,60);drawAvatar(c,24,52,{look:me.look,dir:'down',moving:false,animT:0})}
function picker(label,key,list,asText){
  const row=document.createElement('div');row.className='pick';const s=document.createElement('span');s.textContent=label;const sw=document.createElement('div');sw.className='sw'+(asText?' txt':'');
  list.forEach((v,i)=>{const b=document.createElement('button');b.type='button';b.setAttribute('aria-label',label+' '+(asText?v:i+1));if(asText)b.textContent=v;else b.style.background=v;
    b.setAttribute('aria-pressed',me.look[key]===i);b.onclick=()=>{me.look[key]=i;[...sw.children].forEach((o,j)=>o.setAttribute('aria-pressed',j===i));drawPreview()};sw.appendChild(b)});
  row.append(s,sw);$('#pickers').appendChild(row);
}
function initJoin(){
  try{const sv=JSON.parse(localStorage.getItem('macTown')||'null');if(sv){$('#nameIn').value=cleanStr(sv.name,16);me.look={s:cleanIdx(sv.look.s,8),k:cleanIdx(sv.look.k,6),h:cleanIdx(sv.look.h,8),y:cleanIdx(sv.look.y,5)}}}catch(e){}
  const sp=new URLSearchParams(location.search).get('space');if(sp)$('#spaceIn').value=cleanStr(sp,24);
  drawFacade();picker('Shirt','s',SHIRTS);picker('Skin','k',SKINS);picker('Hair','h',HAIRS);picker('Style','y',STYLES,true);drawPreview();
  if(FIREBASE_CONFIG){$('#spaceField').hidden=false;$('#mode').textContent='Live. Anyone who opens this page with the same space code shares the building with you.'}
  else $('#mode').textContent='Solo preview with a few characters to talk to. Add a Firebase config at the top of the file to share the building with other people.';
  $('#enter').onclick=enter; $('#nameIn').addEventListener('keydown',e=>{if(e.key==='Enter')enter()});
}
async function enter(){
  if(started)return; me.name=cleanStr($('#nameIn').value.trim(),16)||'Guest';
  try{localStorage.setItem('macTown',JSON.stringify({name:me.name,look:me.look}))}catch(e){}
  const btn=$('#enter');btn.disabled=true;
  if(FIREBASE_CONFIG){btn.textContent='Connecting';
    try{await Net.start(cleanStr($('#spaceIn').value,24).replace(/[.#$\[\]\/\s]/g,'-')||'macaulay')}
    catch(err){Net.on=false;console.error(err);sys('Could not reach the multiplayer server, so you are in solo mode. '+err.message)}}
  if(!Net.on)spawnWanderers();
  $('#join').classList.add('off');$('#hud').classList.add('on');resize();buildFloor(me.floor);
  camX=me.x*T-vw/zoom/2;camY=me.y*T-vh/zoom/2;lastTileKey=me.floor+':'+Math.floor(me.x)+','+Math.floor(me.y);
  started=true;Net.push(true);cv.focus();
  sys('You are on West 67th Street. The red doors ahead lead into the lobby.');
  sys(matchMedia('(pointer:coarse)').matches?'Tap where you want to go. Tap a person or an object to interact with it.':'Move with WASD or arrows, or click where you want to go. X looks at things, Enter chats, 1 to 5 are emotes.');
}
initJoin();requestAnimationFrame(frame);
